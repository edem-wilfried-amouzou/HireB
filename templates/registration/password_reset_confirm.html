{% extends "base.html" %}
{% block content %}<section class="narrow stack"><h1>Nouveau mot de passe</h1>
{% if validlink %}<form method="post" class="stack">{% csrf_token %}{% for field in form %}{% include "_field.html" %}{% endfor %}<button class="btn btn-primary btn-block" type="submit">Enregistrer</button></form>
{% else %}<p class="alert alert-error">Ce lien n'est plus valide. Refaites une demande.</p><a class="btn" href="{% url 'accounts:password_reset' %}">Nouvelle demande</a>{% endif %}</section>{% endblock %}
